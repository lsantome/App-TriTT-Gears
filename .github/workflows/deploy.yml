name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; uno nuevo cancela el que esté en cola, no el que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar el sitio
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js fonts icons _site/
          # Versión de la caché ligada al commit: cada despliegue renueva la caché de los dispositivos.
          sed -i "s/const CACHE = \"[^\"]*\"/const CACHE = \"desarrollos-${GITHUB_SHA::7}\"/" _site/sw.js
          grep -q "desarrollos-${GITHUB_SHA::7}" _site/sw.js

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
